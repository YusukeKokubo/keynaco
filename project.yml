name: keynaco

options:
  bundleIdPrefix: com.yusuke
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

packages:
  AzooKeyKanaKanjiConverter:
    path: Packages/AzooKeyKanaKanjiConverter

targets:
  keynaco:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuke.inputmethod.keynaco
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # App Sandbox 有効
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sources/keynaco.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2ZZ3ALJ36
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: InputMethodKit.framework
      - sdk: libsqlite3.tbd
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary

  keynacoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: keynaco

schemes:
  keynaco:
    build:
      targets:
        keynaco: all
      postActions:
        - script: |
            DESTINATION="/Library/Input Methods"
            APP_NAME="${FULL_PRODUCT_NAME}"
            SOURCE_APP="${BUILT_PRODUCTS_DIR}/${APP_NAME}"
            DEST_APP="${DESTINATION}/${APP_NAME}"
            PROCESS_NAME="${EXECUTABLE_NAME}"

            pkill -f "$PROCESS_NAME" || true
            if [ ! -d "$DESTINATION" ]; then mkdir -p "$DESTINATION"; fi
            rm -rf "$DEST_APP"
            cp -R "$SOURCE_APP" "$DEST_APP"
          name: Install to Input Methods
          settingsTarget: keynaco
    run:
      executable: keynaco
    test:
      targets:
        - keynacoTests
