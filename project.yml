name: ykey

options:
  bundleIdPrefix: com.yusuke
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

targets:
  ykey:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/SKK-JISYO-L.utf8
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuke.inputmethod.ykey
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # App Sandbox 有効
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sources/ykey.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2ZZ3ALJ36
        INFOPLIST_FILE: Sources/Info.plist
    dependencies:
      - sdk: InputMethodKit.framework
      - sdk: libsqlite3.tbd

  ykeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ykey
