name: ykey

options:
  bundleIdPrefix: com.yusuke
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

targets:
  ykey:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuke.ykey
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # IME は App Sandbox 無効が必要
        ENABLE_APP_SANDBOX: NO
        # 開発中は自動署名
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/Info.plist
    dependencies:
      - sdk: InputMethodKit.framework
      - sdk: libsqlite3.tbd
